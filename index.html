<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Catcher</title>
    <style>
        /* --- Reset Dasar --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* --- Tampilan Latar Belakang (Body) --- */
        body {
            background-color: #0a1128; /* Warna gelap biru dongker ala cyber */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* Memastikan konten berada di tengah vertikal */
        }

        /* --- Container untuk Logo --- */
        .logo-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
        }

        .logo-container img {
            height: 70px; /* Ukuran proporsional logo */
            object-fit: contain;
            border-radius: 8px; /* Sedikit lengkungan di sudut logo */
        }

        /* --- Kotak Utama Game --- */
        .game-box {
            border: 2px solid #38bdf8; /* Garis biru terang */
            border-radius: 15px;
            padding: 60px 100px;
            text-align: center;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.3); /* Efek glowing/bercahaya */
            background-color: transparent;
        }

        .game-box h1 {
            color: #38bdf8;
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 1.5px;
        }

        .game-box p {
            color: #94a3b8; /* Warna abu-abu terang */
            font-size: 1.1rem;
            margin-bottom: 40px;
        }

        /* --- Tombol --- */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 25px;
            border-radius: 30px; /* Membuat bentuk oval/pil */
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s; /* Animasi saat di-hover */
        }

        .btn:hover {
            background-color: #0284c7; /* Warna berubah lebih gelap saat kursor diarahkan */
            transform: scale(1.05); /* Membesar sedikit */
            color: white;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="onsan.jpeg" alt="ONESANDVOSCHO Logo">
        <img src="smk.jpeg" alt="SMKN 1 Sanden Bantul">
    </div>

    <div class="game-box">
        <h1>CYBER CATCHER</h1>
        <p>Tangkap Bintang Sebanyak-Banyaknya!</p>
        
        <div class="btn-container">
            <button class="btn">1 Player (vs Komputer)</button>
            <button class="btn">2 Players (Berdua)</button>
        </div>
    </div>

    <div class="logo-container">
        <img src="rpll.jpeg" alt="RPL Logo">
        <img src="bpk.jpeg" alt="MOKO Game Development Projects">
    </div>

</body>
</html>

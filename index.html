<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Catcher - Game Mudah GitHub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
        body { background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #game-container { position: relative; border: 3px solid #38bdf8; border-radius: 10px; overflow: hidden; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
        canvas { display: block; background: #1e293b; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        h1 { font-size: 2rem; color: #38bdf8; margin-bottom: 10px; }
        p { margin-bottom: 20px; color: #94a3b8; }
        button { padding: 10px 20px; font-size: 1rem; font-weight: bold; background: #38bdf8; border: none; border-radius: 20px; cursor: pointer; margin: 5px; color: #0f172a; }
        button:hover { background: #fff; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>

        <!-- Menu Utama -->
        <div id="main-menu" class="overlay">
            <h1>CYBER CATCHER</h1>
            <p>Tangkap Bintang Sebanyak-Banyaknya!</p>
            <div>
                <button onclick="startGame('vs_ai')">1 Player (vs Komputer)</button>
                <button onclick="startGame('pvp')">2 Players (Berdua)</button>
            </div>
        </div>

        <!-- Menu Selesai -->
        <div id="over-menu" class="overlay hidden">
            <h1 id="over-title">LEVEL SELESAI</h1>
            <p id="over-msg"></p>
            <div>
                <button id="btn-next" onclick="nextLevel()">Level Selanjutnya</button>
                <button onclick="restartGame()">Main Lagi</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Web Audio untuk Efek Suara
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'catch') {
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'win') {
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.setValueAtTime(1000, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            }
        }

        // Variable Game
        let gameMode = 'vs_ai';
        let currentLevel = 1;
        let timeLeft = 30;
        let timerInterval;
        let isRunning = false;

        let p1 = { x: 150, y: 360, w: 70, h: 15, score: 0, color: '#38bdf8', speed: 8 };
        let p2 = { x: 380, y: 360, w: 70, h: 15, score: 0, color: '#f43f5e', speed: 8 };

        let item = { x: 300, y: 0, size: 12, speedY: 3, color: '#facc15' };

        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function resetItem() {
            item.x = Math.random() * (canvas.width - 20) + 10;
            item.y = -10;
            item.speedY = 3 + (currentLevel * 1.2);
        }

        function startGame(mode) {
            gameMode = mode;
            currentLevel = 1;
            p1.score = 0;
            p2.score = 0;
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('over-menu').classList.add('hidden');
            initLevel();
        }

        function initLevel() {
            timeLeft = 30;
            p1.x = 150;
            p2.x = 380;
            resetItem();
            isRunning = true;

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isRunning) {
                    timeLeft--;
                    if (timeLeft <= 0) endLevel();
                }
            }, 1000);

            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (!isRunning) return;

            // Kontrol P1 (A / D)
            if (keys['a'] || keys['A']) p1.x -= p1.speed;
            if (keys['d'] || keys['D']) p1.x += p1.speed;
            p1.x = Math.max(0, Math.min(canvas.width - p1.w, p1.x));

            // Kontrol P2 atau AI
            if (gameMode === 'pvp') {
                if (keys['ArrowLeft']) p2.x -= p2.speed;
                if (keys['ArrowRight']) p2.x += p2.speed;
            } else {
                // Pergerakan AI Komputer yang sederhana
                let aiTarget = item.x - p2.w / 2;
                let aiSpeed = 3 + currentLevel;
                if (p2.x < aiTarget) p2.x += Math.min(aiSpeed, aiTarget - p2.x);
                else if (p2.x > aiTarget) p2.x -= Math.min(aiSpeed, p2.x - aiTarget);
            }
            p2.x = Math.max(0, Math.min(canvas.width - p2.w, p2.x));

            // Pergerakan Bintang Jatuh
            item.y += item.speedY;

            // Cek jika P1 menangkap bintang
            if (item.y + item.size >= p1.y && item.x >= p1.x && item.x <= p1.x + p1.w) {
                p1.score++;
                playSound('catch');
                resetItem();
            }

            // Cek jika P2 menangkap bintang
            if (item.y + item.size >= p2.y && item.x >= p2.x && item.x <= p2.x + p2.w) {
                p2.score++;
                playSound('catch');
                resetItem();
            }

            // Jika bintang menyentuh tanah (luput)
            if (item.y > canvas.height) {
                resetItem();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Gambar Karakter Player 1 & 2
            ctx.fillStyle = p1.color;
            ctx.fillRect(p1.x, p1.y, p1.w, p1.h);

            ctx.fillStyle = p2.color;
            ctx.fillRect(p2.x, p2.y, p2.w, p2.h);

            // Gambar Bintang Jatuh
            ctx.fillStyle = item.color;
            ctx.beginPath();
            ctx.arc(item.x, item.y, item.size, 0, Math.PI * 2);
            ctx.fill();

            // Tampilan Poin & Waktu
            ctx.font = 'bold 16px sans-serif';
            ctx.fillStyle = p1.color;
            ctx.fillText(`P1: ${p1.score}`, 20, 30);

            ctx.fillStyle = p2.color;
            let p2Name = gameMode === 'vs_ai' ? 'BOT' : 'P2';
            ctx.fillText(`${p2Name}: ${p2.score}`, canvas.width - 80, 30);

            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.fillText(`Level ${currentLevel} | Waktu: ${timeLeft}s`, canvas.width / 2, 30);
            ctx.textAlign = 'left';
        }

        function gameLoop() {
            if (isRunning) {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }
        }

        function endLevel() {
            isRunning = false;
            clearInterval(timerInterval);
            playSound('win');

            const menu = document.getElementById('over-menu');
            const title = document.getElementById('over-title');
            const msg = document.getElementById('over-msg');
            const btnNext = document.getElementById('btn-next');

            menu.classList.remove('hidden');

            let winner = "Seri!";
            if (p1.score > p2.score) winner = "Player 1 Menang!";
            else if (p2.score > p1.score) winner = gameMode === 'vs_ai' ? "Komputer Menang!" : "Player 2 Menang!";

            title.innerText = `LEVEL ${currentLevel} SELESAI`;
            msg.innerHTML = `${winner}<br>Skor: ${p1.score} vs ${p2.score}`;

            if (currentLevel < 5) {
                btnNext.classList.remove('hidden');
            } else {
                btnNext.classList.add('hidden');
                title.innerText = "SELAMAT!";
                msg.innerHTML += "<br>Kamu telah menamatkan semua level!";
            }
        }

        function nextLevel() {
            currentLevel++;
            document.getElementById('over-menu').classList.add('hidden');
            initLevel();
        }

        function restartGame() {
            document.getElementById('over-menu').classList.add('hidden');
            startGame(gameMode);
        }
    </script>
</body>
</html>
